name: Supabase keepalive

# Free-tier Supabase projects pause after a week of inactivity.
# Ping the auth health endpoint every 3 days so the project stays awake.
on:
  schedule:
    - cron: "0 3 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" "$SUPABASE_URL/auth/v1/health")
          echo "HTTP $status"
          test "$status" = "200"
